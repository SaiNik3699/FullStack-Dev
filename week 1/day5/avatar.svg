<!--
  assets/avatar.svg
  A placeholder profile picture drawn as SVG so the repo stays text-only.
  Swap it for a real photo any time: drop your .jpg in this folder and change
  the src in index.html. Keep the alt text meaningful either way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustrated profile avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)" />
  <circle cx="100" cy="78" r="34" fill="#ffffff" opacity="0.95" />
  <path d="M100 120c-33 0-60 21-66 50a100 100 0 0 0 132 0c-6-29-33-50-66-50Z" fill="#ffffff" opacity="0.95" />
</svg>
